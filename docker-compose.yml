# Local development stack.
#   First time only:  ./scripts/generate-secrets.sh     (creates .env with strong random passwords)
#   Then:             docker compose up --build
#
# Security:
#   - Postgres and Redis both require passwords (from the .env file next to this one).
#   - The API connects as "gharkhoji_app", a normal user that owns only the GharKhoji
#     databases — not the "postgres" superuser.
#   - Postgres is reachable only from this computer (127.0.0.1), not from your Wi-Fi.
#     Redis isn't reachable from outside Docker at all.

x-backend-env: &backend-env
  # Inside Docker, services reach each other by service name, not "localhost"
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-gharkhoji_app}:${APP_DB_PASSWORD:?Run ./scripts/generate-secrets.sh first}@db:5432/gharkhoji
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run ./scripts/generate-secrets.sh first}@redis:6379/0
  TEST_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-gharkhoji_app}:${APP_DB_PASSWORD}@db:5432/gharkhoji_test
  TEST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/15

services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: ./backend/.env
    environment: *backend-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # live reload: edit code on your laptop, server restarts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs: freshness reminders + auto-expiry
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: ./backend/.env
    environment: *backend-env
    command: python -m app.workers.main
    restart: on-failure
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_started   # api runs the migrations first
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/generate-secrets.sh first}
      POSTGRES_DB: gharkhoji
      # Passwords are checked with SCRAM-SHA-256 (never sent or stored in plain text)
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER:-gharkhoji_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the app user and the test database
      - ./backend/scripts/db-init.sh:/docker-entrypoint-initdb.d/20-gharkhoji.sh:ro
    healthcheck:
      # -h 127.0.0.1 checks the real network port, so it only passes after Postgres's first-time setup restart
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gharkhoji"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --protected-mode yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # no "ports:" — only the api and worker containers can reach Redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
